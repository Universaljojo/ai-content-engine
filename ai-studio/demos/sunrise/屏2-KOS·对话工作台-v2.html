<script>
const S = window.SUNRISE;
let currentAnchor = 'hook'; // hook / script / director / compliance / biz / casting / budget / sample / sampleReview / publish

const ANCHORS = [
  { id: 'hook',         label: '钩子方向',     state: 'queue' },
  { id: 'script',       label: '脚本',         state: 'queue' },
  { id: 'director',     label: '编导审',       state: 'queue' },
  { id: 'compliance',   label: '合规扫描',     state: 'queue' },
  { id: 'biz',          label: '业务校准',     state: 'queue' },
  { id: 'scene',        label: '场景图',       state: 'queue' },
  { id: 'audio',        label: '配音',         state: 'queue' },
  { id: 'sample',       label: '样片',         state: 'queue' },
  { id: 'sampleReview', label: '内容再审',     state: 'queue' },
  { id: 'qa',           label: '质检 · 压测',   state: 'queue' },
  { id: 'publish',      label: '上架',         state: 'queue' },
];

// beat 完成时,把哪个 anchor 标 done
const BEAT_TO_ANCHOR = {
  'hooks-pension':            'hook',
  'script-a':                 'script',
  'director-audit':           'director',
  'compliance-scan':          'compliance',
  'compliance-result':        'compliance',
  'biz-audit':                'biz',
  'production-step-1':        'scene',
  'production-step-2':        'audio',
  'production-step-3':        'sample',
  'sample-review':            'sampleReview',
  'production-redo':          'sample',
  'qa':                       'qa',
  'publish':                  'publish',
};

function renderAnchors() {
  document.getElementById('anchor-list').innerHTML = ANCHORS.map(a => {
    const cls = ['anchor-item', a.state, currentAnchor === a.id ? 'active' : ''].join(' ');
    return `<div class="${cls}" onclick="showCanvas('${a.id}')">
      <span class="dot"></span>
      <span>${a.label}</span>
    </div>`;
  }).join('');
}

// ============================================================
// playBeat() 状态机 · 取代旧 renderStream
// 流程:typing → append messages(带逐条延时)→ canvas 切换 → 渲染 decision
// 用户点 decision 选项 → 锁定选中态 + 追加用户气泡 + playBeat(option.next)
// ============================================================
const stream = () => document.getElementById('stream');

function appendEl(el) {
  const host = stream();
  host.appendChild(el);
  host.scrollTop = host.scrollHeight;
}

// ---------- 各类消息块构造 ----------
function elTime(text) {
  const el = document.createElement('div');
  el.className = 'time-div';
  el.textContent = text;
  return el;
}

function elSys(text) {
  const el = document.createElement('div');
  el.className = 'sys-event';
  el.innerHTML = `<span class="ic">${S.ic('bolt', 12)}</span><span>${text}</span>`;
  return el;
}

function elTyping(who) {
  const a = S.AGENTS[who];
  const vibes = a.vibes && a.vibes.length ? a.vibes : ['思考中'];
  const vibe = vibes[Math.floor(Math.random() * vibes.length)];
  const el = document.createElement('div');
  el.className = 'typing-bubble';
  el.dataset.who = who;
  el.innerHTML = `
    <div class="ava"><img src="${a.ava}" alt="${a.name}"></div>
    <div class="body">
      <span class="nm">${a.name}</span>
      <span>${vibe}</span>
      <span class="dots"><span></span><span></span><span></span></span>
    </div>`;
  return el;
}

function elThinking(m) {
  const a = S.AGENTS[m.who];
  const el = document.createElement('div');
  el.className = 'think-card';
  el.innerHTML = `
    <div class="head">
      <span>${m.title || '思考中'}</span>
      <span class="who">· ${a.name}${m.when ? ' · ' + m.when : ''}</span>
    </div>
    <div class="body">${m.body}</div>`;
  return el;
}

function elMsg(m) {
  const a = S.AGENTS[m.who];
  const isMe = m.who === 'xiaocao';
  const el = document.createElement('div');
  el.className = 'bubble' + (isMe ? ' me' : '');
  const ev = (m.evidence || []).map(e => {
    const cls = (e.type || 'ev').trim();
    return `<span class="${cls}">${e.text}</span>`;
  }).join('');
  const viewLink = m.action ? `<span class="view-link" onclick="showCanvas('${m.action}')">在右边查看 ${S.ic('arrow', 11)}</span>` : '';
  el.innerHTML = `
    <div class="ava"><img src="${a.ava}" alt="${a.name}"></div>
    <div class="body">
      <div class="head"><b>${a.name}</b><span class="when">${m.when || ''}</span></div>
      <div class="msg">
        ${m.text.split('\n').map(p => `<p>${p}</p>`).join('')}
        ${viewLink}
        ${ev ? `<div class="evidence">${ev}</div>` : ''}
      </div>
    </div>`;
  return el;
}

function elUser(text, when) {
  const el = document.createElement('div');
  el.className = 'bubble me';
  const a = S.AGENTS.xiaocao;
  el.innerHTML = `
    <div class="ava"><img src="${a.ava}" alt="${a.name}"></div>
    <div class="body">
      <div class="head"><b>${a.name}</b><span class="when">${when || '刚刚'}</span></div>
      <div class="msg"><p>${text}</p></div>
    </div>`;
  return el;
}

// ---------- 欢迎引导卡 ----------
function elWelcome(beat) {
  const wrap = document.createElement('div');
  // 今日产线 brief(数据回流落到欢迎卡之上,作为生产前的数据输入)
  const brief = document.createElement('div');
  brief.className = 'today-brief';
  brief.innerHTML = `
    <div class="tb">
      <div class="lbl">本月已上架</div>
      <div class="v">12 条 <span class="small">+ 3 待审</span></div>
      <div class="d">平均采纳率 <b style="color:var(--accent);">28%</b> · 高于基线 15%</div>
    </div>
    <div class="tb">
      <div class="lbl">TOP 表现</div>
      <div class="v">巨人踩楼</div>
      <div class="d">412 try-on · 1,847 次互动 · 30 天</div>
    </div>
    <div class="tb hot" onclick="window.open('屏6-热点中心.html', '_blank')">
      <div class="lbl">跨平台热点 Top 3</div>
      <div class="v">雪山救狐 <span class="small">+248%</span></div>
      <div class="pill-line"><span>拍手变装</span><span>禅者行脚</span></div>
    </div>`;
  wrap.appendChild(brief);
  // 欢迎卡本体
  const el = document.createElement('div');
  el.className = 'welcome-card';
  const opts = beat.options.map(o => `
    <button class="wopt" onclick="pickOption('${o.id}','${o.label}','${o.next}')">
      <div class="wlabel">✨ ${o.label}</div>
      <div class="wsub">${o.sub || ''}</div>
    </button>`).join('');
  el.innerHTML = `
    <div class="wtitle">${beat.title}</div>
    <div class="wsubtitle">${beat.subtitle}</div>
    <div class="woptions">${opts}</div>
    <div class="whint">↑ 选一个或在下面输入框直接说</div>`;
  wrap.appendChild(el);
  return wrap;
}

// ---------- 决策卡(可点击)----------
function elDecision(decision) {
  const el = document.createElement('div');
  el.className = 'decision-v2';
  el.dataset.role = 'decision';
  const opts = decision.options.map(o => `
    <button class="dopt ${o.primary ? 'primary' : ''}" data-id="${o.id}"
            onclick="pickOption('${o.id}','${o.label.replace(/'/g, "\\'")}','${o.next}', this)">
      <div class="dlabel">${o.label}</div>
      ${o.sub ? `<div class="dsub">${o.sub}</div>` : ''}
    </button>`).join('');
  el.innerHTML = `
    <div class="dtitle">${decision.title}</div>
    <div class="dopts">${opts}</div>`;
  return el;
}

// ---------- 工作中状态条 ----------
function setWorking(who, text) {
  const w = document.getElementById('working-state');
  if (!who) { w.style.display = 'none'; return; }
  const a = S.AGENTS[who];
  w.style.display = 'inline-flex';
  w.querySelector('.text').textContent = text || `${a.name} · 工作中`;
}

// ---------- 锚点状态推进 ----------
function markAnchorDone(beatId) {
  const anchorId = BEAT_TO_ANCHOR[beatId];
  if (!anchorId) return;
  const a = ANCHORS.find(x => x.id === anchorId);
  if (a) a.state = beatId === 'publish' ? 'published' : 'done';
  // 下一个 anchor 标 now
  const idx = ANCHORS.findIndex(x => x.id === anchorId);
  if (idx >= 0 && idx < ANCHORS.length - 1) {
    if (ANCHORS[idx + 1].state === 'queue') ANCHORS[idx + 1].state = 'now';
  }
  renderAnchors();
}

// ---------- 锁定决策卡(用户点完后)----------
function lockDecision(pickedId, pickedLabel) {
  const cards = document.querySelectorAll('.decision-v2');
  const last = cards[cards.length - 1];
  if (!last) return;
  last.classList.add('locked');
  last.querySelectorAll('.dopt').forEach(b => {
    if (b.dataset.id === pickedId) b.classList.add('picked');
  });
}

// ---------- 核心:播放一个 beat ----------
let _beatBusy = false;
async function playBeat(beatId) {
  if (_beatBusy) return;
  _beatBusy = true;
  const beat = S.STORY_BEATS_V2[beatId];
  if (!beat) { _beatBusy = false; return; }

  // 标 anchor 完成
  markAnchorDone(beatId);

  // welcome 卡:直接渲染,不走 typing 流程
  if (beat.type === 'guide') {
    appendEl(elWelcome(beat));
    setWorking(null);
    _beatBusy = false;
    return;
  }

  // 用户气泡(如果 beat 自带预设的"我说了什么")
  if (beat.user) {
    appendEl(elUser(beat.user.text, beat.user.when));
    await sleep(300);
  }

  // 系统事件条(谁加入群聊)
  if (beat.sys) {
    appendEl(elSys(beat.sys));
    await sleep(400);
  }

  // typing 状态(Agent 正在 xxx)· 没 typing 时清掉残留状态
  let typingEl = null;
  if (beat.typing) {
    typingEl = elTyping(beat.typing.who);
    appendEl(typingEl);
    setWorking(beat.typing.who);
    await sleep(beat.typing.dur || 1500);
  } else {
    setWorking(null);
  }

  // messages 逐条 append(去掉 typing 气泡)
  if (typingEl) typingEl.remove();
  const msgs = beat.messages || [];
  for (let i = 0; i < msgs.length; i++) {
    const m = msgs[i];
    if (m.kind === 'thinking') {
      appendEl(elThinking(m));
    } else {
      appendEl(elMsg(m));
    }
    if (i < msgs.length - 1) await sleep(500);
  }

  // 切右侧 canvas
  if (beat.canvas) showCanvas(beat.canvas);

  // 渲染 decision
  if (beat.decision) {
    await sleep(300);
    appendEl(elDecision(beat.decision));
  } else {
    setWorking(null);
  }

  // beat 完成
  _beatBusy = false;

  // 链式自动推进(用于 production-step-1/2 这种连续步骤)
  if (!beat.decision && beat.nextAuto) {
    setTimeout(() => playBeat(beat.nextAuto.next), beat.nextAuto.delay || 1200);
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ---------- 用户点了 decision 选项 ----------
function pickOption(id, label, nextBeatId, btn) {
  // 锁定当前决策卡
  lockDecision(id, label);
  // 追加用户气泡
  appendEl(elUser(label, '刚刚'));
  // 隐藏空状态
  const empty = document.getElementById('canvas-empty');
  if (empty) empty.style.display = 'none';
  // 进入下一个 beat
  setTimeout(() => playBeat(nextBeatId), 400);
}

// ---------- 顶部控制按钮 ----------
function restartFlow() {
  document.getElementById('stream').innerHTML = '';
  ANCHORS.forEach(a => a.state = 'queue');
  renderAnchors();
  setWorking(null);
  document.getElementById('canvas-body').innerHTML = `
    <div id="canvas-empty" style="text-align:center;color:var(--ink-3);padding:80px 20px;font-size:13px;line-height:1.7;">
      <div style="font-size:38px;margin-bottom:14px;opacity:0.55;">🌅</div>
      还没开始。<br>先在左边告诉编导你今天想做哪一类视频。
    </div>`;
  document.getElementById('canvas-stage-label').textContent = '当前产物';
  document.getElementById('canvas-title').textContent = '—';
  playBeat('welcome');
}

function goToWelcome() { restartFlow(); }

// ---------- 右栏 · 焦点产物切换 ----------
function showCanvas(anchorId) {
  if (!anchorId) return;
  // 隐藏空状态
  const empty = document.getElementById('canvas-empty');
  if (empty) empty.style.display = 'none';

  currentAnchor = anchorId;
  renderAnchors();
  const renderers = {
    hook: renderHookVariants,
    script: renderScript,
    director: renderDirectorAudit,
    compliance: renderComplianceScan,             // 默认 anchor 点击 → 雷达(可重看)
    complianceScan: renderComplianceScan,         // beat 触发 → 雷达
    complianceDetail: renderComplianceAudit,      // 雷达 verdict 「查看详情」 → audit 卡
    biz: renderBizAudit,
    scene: renderScene,
    audio: renderAudio,
    sample: renderSample,
    meta: renderMeta,                              // V2 · 配套物料
    samplereview: renderSampleReview,
    sampleReview: renderSampleReview,
    qa: renderQA,
    publish: renderPublish,
    // Agent message action 别名
    showHookVariants:    renderHookVariants,
    showScript:          renderScript,
    showDirectorAudit:   renderDirectorAudit,
    showComplianceAudit: renderComplianceAudit,
    showComplianceDetail: renderComplianceAudit,
    showBizAudit:        renderBizAudit,
    showScene:           renderScene,
    showAudio:           renderAudio,
    showSample:          renderSample,
    showMeta:            renderMeta,               // V2 · 配套物料
    showSampleReview:    renderSampleReview,
    showQA:              renderQA,
    showPublish:         renderPublish,
  };
  const fn = renderers[anchorId] || renderers[anchorId.toLowerCase()];
  if (fn) fn();
}

function _cscan2Log(level, msg, ts) {
  const stream = document.getElementById('cscan2-log-stream');
  if (!stream) return;
  const tagMap = { info: '·', scan: '▶', ok: '✓', warn: '⚠', fail: '✗', detail: '↳', boom: '★' };
  const row = document.createElement('div');
  row.className = 'lrow ' + level;
  row.innerHTML = `
    <span class="ts">${ts}</span>
    <span class="tag">${tagMap[level] || '·'}</span>
    <span class="msg">${msg}</span>`;
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;
}

function _cscan2Ts(ms) {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}.${String(d.getMilliseconds()).padStart(3, '0')}`;
}

function startCscan2Anim(rules, totalDur) {
  if (_cscan2Raf) cancelAnimationFrame(_cscan2Raf);
  _cscan2Timers.forEach(t => clearTimeout(t));
  _cscan2Timers = [];

  // 雷达 spokes + 角度数字
  const radar = document.getElementById('cscan2-radar');
  radar.querySelectorAll('.b-spoke, .b-deg, .b-node, .b-hitpop').forEach(n => n.remove());
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('div');
    s.className = 'b-spoke';
    s.style.transform = `rotate(${i * 60}deg)`;
    radar.appendChild(s);
  }
  [0, 60, 120, 180, 240, 300].forEach(deg => {
    const d = document.createElement('div');
    d.className = 'b-deg';
    d.textContent = String(deg).padStart(3, '0') + '°';
    const rad = (deg - 90) * Math.PI / 180;
    const dist = 47;
    d.style.left = `calc(${50 + Math.cos(rad) * dist}% - 12px)`;
    d.style.top  = `calc(${50 + Math.sin(rad) * dist}% - 6px)`;
    radar.appendChild(d);
  });
  // 9 个对象节点(均匀分布在圆周 40°/40°/40°...)
  const objects = rules;   // rules 已经是对象列表(COMPLIANCE_SCAN_OBJECTS_V2)
  const N = objects.length;
  const angles = Array.from({ length: N }, (_, i) => -90 + i * (360 / N));
  objects.forEach((obj, i) => {
    const node = document.createElement('div');
    node.className = 'b-node';
    node.dataset.id = obj.id;
    node.innerHTML = `<span>${String(i + 1).padStart(2, '0')}</span><span class="nlbl">${obj.name.slice(0, 4)}</span>`;
    const ang = angles[i] * Math.PI / 180;
    const dist = 35;
    node.style.left = (50 + Math.cos(ang) * dist) + '%';
    node.style.top  = (50 + Math.sin(ang) * dist) + '%';
    radar.appendChild(node);
  });

  let done = 0, ok = 0, warn = 0, fail = 0;
  let charsCounted = 0, rulesCounted = 0, depthCounted = 0;
  const startMs = Date.now();
  const sweep = document.getElementById('cscan2-sweep');
  const trail = document.getElementById('cscan2-trail');
  trail.classList.add('run');
  document.getElementById('cscan2-status').textContent = '扫描中';
  document.getElementById('cscan2-counter').innerHTML = `0<span class="slash">/${N}</span>`;

  // 启动 banner · 对象主语(列出 9 个扫描对象)
  const banner = [
    [   0, 'info', '────────────────────────────────────────' ],
    [  20, 'boom', '◉ Sunrise 合规雷达 v2026.05 · 启动扫描' ],
    [  60, 'info', '────────────────────────────────────────' ],
    [ 100, 'info', '加载扫描引擎: scanner_core_v2.so (2,847 KB)' ],
    [ 160, 'info', '加载规则注册表: rules_registry.db' ],
    [ 220, 'scan', '注册 6 类规则集 → 410 条规则条款 · 武器库就位' ],
    [ 280, 'detail', '  ◇ 《广告法》第九条 / 《销售管理办法》第十条' ],
    [ 320, 'detail', '  ◇ 银保监 2023[12] / 阳光红线词库(291 词)' ],
    [ 360, 'detail', '  ◇ 行业舆情数据库(128 延伸词)/ 不吉利场景(12 模式)' ],
    [ 410, 'info', '调用历史指纹库: 已分析 12,847 条上架模板' ],
    [ 470, 'scan', `本次扫描目标:${N} 个内容对象(视频本体 5 + 配套文字 4)` ],
    [ 520, 'detail', '  ① 台词文本    · script_v2.txt (4,200 字符)' ],
    [ 555, 'detail', '  ② 字幕文件    · caption_zh.srt (1,247 B)' ],
    [ 590, 'detail', '  ③ 配音转写    · audio_transcript.json (14.8s)' ],
    [ 625, 'detail', '  ④ 抽帧画面    · frame_001~012.jpg (12 帧)' ],
    [ 660, 'detail', '  ⑤ 封面图      · cover_9x16 + cover_1x1 (2 规格)' ],
    [ 695, 'detail', '  ⑥ 视频标题    · title.txt (13 字)' ],
    [ 730, 'detail', '  ⑦ 视频描述    · description.txt (67 字)' ],
    [ 765, 'warn',   '  ⑧ 朋友圈话术  · friend_circle_copy.txt (124 字) ⚠ 高危区' ],
    [ 800, 'detail', '  ⑨ 平台标签集  · tags.json (4 平台 · 18 hashtag)' ],
    [ 850, 'info', '扫描深度:字符 → 词 → 句 → 语义 → 上下文 (5 层)' ],
    [ 910, 'boom', `▶▶▶ 启动扫描 · ${N} 对象 × 6 规则 = ${N * 6} 次扫描循环` ],
    [ 970, 'info', '────────────────────────────────────────' ],
  ];
  banner.forEach(([d, lv, m]) => {
    _cscan2Timers.push(setTimeout(() => _cscan2Log(lv, m, _cscan2Ts(startMs + d)), d));
  });

  // 雷达扫描 tick(同步推进字符/法源/深度)
  const tick = () => {
    const dt = Date.now() - startMs;
    const ang = -90 + (dt / totalDur) * 360;
    sweep.style.transform = `rotate(${ang}deg)`;
    trail.style.transform = `rotate(${ang}deg)`;
    charsCounted = Math.min(6800, Math.floor((dt / totalDur) * 6800));
    rulesCounted = Math.min(410, Math.floor((dt / totalDur) * 410));
    depthCounted = Math.min(5, Math.floor((dt / totalDur) * 5));
    const baseSpeed = dt > 200 ? Math.floor(charsCounted / (dt / 1000)) : 0;
    const speed = baseSpeed > 0 ? baseSpeed * 6 + Math.floor((Math.sin(dt / 80) + 1) * 300) : 0;
    document.getElementById('cscan2-c-chars').textContent = charsCounted.toLocaleString();
    document.getElementById('cscan2-c-rules').textContent = rulesCounted;
    document.getElementById('cscan2-c-depth').textContent = depthCounted;
    document.getElementById('cscan2-c-chars-bar').style.width = (charsCounted / 6800 * 100) + '%';
    document.getElementById('cscan2-c-rules-bar').style.width = (rulesCounted / 410 * 100) + '%';
    document.getElementById('cscan2-c-depth-bar').style.width = (depthCounted / 5 * 100) + '%';
    document.getElementById('cscan2-subdata').innerHTML = `<span class="v">${charsCounted.toLocaleString()}</span> 字符 · <span class="v">${rulesCounted}</span> 法源`;
    document.getElementById('cscan2-speed').innerHTML = speed > 0 ? `<b>${speed.toLocaleString()}</b> 字符/秒` : '—';
    if (dt < totalDur) {
      _cscan2Raf = requestAnimationFrame(tick);
    } else {
      sweep.style.transform = `rotate(270deg)`;
      trail.classList.remove('run');
    }
  };
  tick();

  // 逐对象扫描(对象主语:每个对象被 6 类规则扫一遍)
  let elapsed = 1050;
  objects.forEach((obj, idx) => {
    _cscan2Timers.push(setTimeout(() => {
      const node = document.querySelector(`.cscan2 .b-node[data-id="${obj.id}"]`);
      if (node) node.classList.add('scanning');
    }, elapsed));

    const detail = CSCAN2_DETAIL[obj.id] || [];
    const slice = obj.dur / (detail.length + 2);
    detail.forEach((d, i) => {
      const [lv, msg] = d;
      _cscan2Timers.push(setTimeout(() => {
        _cscan2Log(lv, msg, _cscan2Ts(Date.now()));
      }, elapsed + slice * (i + 1)));
    });

    _cscan2Timers.push(setTimeout(() => {
      const node = document.querySelector(`.cscan2 .b-node[data-id="${obj.id}"]`);
      if (node) {
        node.classList.remove('scanning');
        node.classList.add(obj.sev);
      }
      if (obj.sev === 'warn' || obj.sev === 'fail') {
        const pop = document.createElement('div');
        pop.className = 'b-hitpop';
        pop.innerHTML = `⚠⚠⚠ <b>命中</b> · ${String(idx + 1).padStart(2, '0')} ${obj.name}`;
        pop.style.left = (parseFloat(node.style.left) + 6) + '%';
        pop.style.top  = node.style.top;
        document.getElementById('cscan2-radar').appendChild(pop);
        setTimeout(() => pop.classList.add('show'), 30);
        setTimeout(() => pop.remove(), 3000);
      }
      done++;
      // detail 自带 ok/warn 行,只更新 counter
      if (obj.sev === 'ok')   ok++;
      if (obj.sev === 'warn') warn++;
      if (obj.sev === 'fail') fail++;
      document.getElementById('cscan2-counter').innerHTML = `${done}<span class="slash">/${N}</span>`;
      document.getElementById('cscan2-c-ok').textContent   = ok;
      document.getElementById('cscan2-c-warn').textContent = warn;

      if (idx < objects.length - 1) {
        const pct = Math.floor(((idx + 1) / objects.length) * 100);
        setTimeout(() => {
          _cscan2Log('progress', `[ PROGRESS ] ${idx + 1}/${N} 对象 · ${pct}% · 累计 ${(idx + 1) * 6} 次规则比对`, _cscan2Ts(Date.now()));
        }, 50);
      }
    }, elapsed + obj.dur));

    elapsed += obj.dur;
  });

  // 全部完成
  _cscan2Timers.push(setTimeout(() => {
    document.getElementById('cscan2-status').textContent = '扫描完成';
    document.getElementById('cscan2-c-chars').textContent = '6,800';
    document.getElementById('cscan2-c-rules').textContent = '410';
    document.getElementById('cscan2-c-depth').textContent = '5';
    ['cscan2-c-chars-bar', 'cscan2-c-rules-bar', 'cscan2-c-depth-bar'].forEach(id => document.getElementById(id).style.width = '100%');
    document.getElementById('cscan2-subdata').innerHTML = '<span class="v">6,800</span> 字符 · <span class="v">410</span> 法源';

    const conf = fail ? 92.4 : warn ? 99.2 : 99.8;
    document.getElementById('cscan2-c-conf').textContent = conf;

    const v = document.getElementById('cscan2-verdict');
    v.classList.add('show');
    const detailChip = ` <span class="vchip" onclick="showCanvas('complianceDetail')">📋 查看详情卡 →</span>`;
    if (fail) {
      v.classList.add('fail');
      v.innerHTML = `<span class="vmark">❌</span>扫描到 <b>${fail}</b> 处拦截 · 不可上架` + detailChip;
    } else if (warn) {
      v.classList.add('warn');
      v.innerHTML = `<span class="vmark">⚠</span><b>${warn}</b> 处需改写(⑧ 朋友圈话术)· <b>0</b> 处拦截 · 整体可上架 · 置信度 ${conf}%` + detailChip;
    } else {
      v.classList.add('ok');
      v.innerHTML = `<span class="vmark">✅</span>全部通过 · 可直接上架 · 置信度 ${conf}%` + detailChip;
    }
    _cscan2Log('boom', `▶▶▶ 扫描完成 · ${N} 对象 × 6 规则 = ${N * 6} 次比对 · ${ok} 对象全过 · ${warn} 对象改写 · ${fail} 对象拦截`, _cscan2Ts(Date.now()));
  }, totalDur + 600));
}

}

  S.toast(`切到方向 ${v},加载对应对话历史 · (demo)`);
}

  S.HOOK_VARIANTS_TPL_004.forEach(v => v.selected = v.id === id);

  document.querySelectorAll('.cast-card').forEach((c, i) => c.classList.toggle('picked', i === idx));
}
