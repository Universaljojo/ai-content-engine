<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bg-pr" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#e6d8c0"/>
      <stop offset="60%" stop-color="#bfa580"/>
      <stop offset="100%" stop-color="#7e6543"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg-pr)"/>
  <!-- 后排两个人剪影 -->
  <!-- left back -->
  <circle cx="24" cy="32" r="7" fill="#2a1d13"/>
  <ellipse cx="24" cy="32" rx="5" ry="6" fill="#e8b88a"/>
  <path d="M14 78 Q14 50 24 50 Q34 50 34 78 Z" fill="#3a2a1d" opacity="0.95"/>
  <!-- right back -->
  <circle cx="56" cy="32" r="7" fill="#1e1612"/>
  <ellipse cx="56" cy="32" rx="5" ry="6" fill="#f4c79a"/>
  <path d="M46 78 Q46 50 56 50 Q66 50 66 78 Z" fill="#2c2520" opacity="0.95"/>
  <!-- 中心前排 -->
  <circle cx="40" cy="40" r="9" fill="#3a1f1f"/>
  <ellipse cx="40" cy="40" rx="7" ry="8" fill="#f6d4ad"/>
  <!-- 中心人眼 -->
  <circle cx="37" cy="40" r="1.2" fill="#2b1d12"/>
  <circle cx="43" cy="40" r="1.2" fill="#2b1d12"/>
  <!-- 中心人嘴 -->
  <path d="M37 44 Q40 46 43 44" stroke="#7a4a2c" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- 中心人衣服(主色:暖橙) -->
  <path d="M26 78 Q26 56 40 56 Q54 56 54 78 Z" fill="#c96442" opacity="0.95"/>
  <!-- 中心人脖领 -->
  <path d="M34 56 L40 60 L46 56 L46 58 L40 64 L34 58 Z" fill="#fdf6ec" opacity="0.6"/>
  <!-- 左后人眼 -->
  <circle cx="22" cy="32" r="0.9" fill="#2b1d12"/>
  <circle cx="26" cy="32" r="0.9" fill="#2b1d12"/>
  <!-- 右后人眼 -->
  <circle cx="54" cy="32" r="0.9" fill="#2b1d12"/>
  <circle cx="58" cy="32" r="0.9" fill="#2b1d12"/>
  <!-- 小工具角标(摄像机) -->
  <g transform="translate(58 60)" opacity="0.95">
    <rect x="0" y="2" width="10" height="6" rx="1" fill="#1e1612"/>
    <polygon points="10,3 14,1 14,9 10,7" fill="#1e1612"/>
    <circle cx="3" cy="5" r="1.4" fill="#c96442"/>
  </g>
</svg>
