<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bg-bz" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d6ead8"/>
      <stop offset="60%" stop-color="#9bc7a5"/>
      <stop offset="100%" stop-color="#5a8a6a"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg-bz)"/>
  <!-- shoulders / professional jacket -->
  <path d="M14 78 Q14 56 40 56 Q66 56 66 78 Z" fill="#2f4d3a" opacity="0.95"/>
  <!-- collar V -->
  <path d="M34 56 L40 64 L46 56 L46 60 L40 70 L34 60 Z" fill="#ede0c8" opacity="0.55"/>
  <!-- tie hint -->
  <path d="M38 58 L40 70 L42 58 Z" fill="#7a3a3a"/>
  <!-- hair (neat back) -->
  <path d="M24 38 Q24 18 40 16 Q56 18 56 38 Q54 30 50 28 Q44 28 40 30 Q34 28 30 28 Q26 30 24 38 Z" fill="#2a1d13"/>
  <!-- face -->
  <ellipse cx="40" cy="42" rx="14.5" ry="16" fill="#f4c79a"/>
  <!-- glasses (square, business-style) -->
  <rect x="29" y="39" width="9" height="7" rx="1.5" fill="#fff" opacity="0.18" stroke="#2a1d13" stroke-width="1.3"/>
  <rect x="42" y="39" width="9" height="7" rx="1.5" fill="#fff" opacity="0.18" stroke="#2a1d13" stroke-width="1.3"/>
  <line x1="38" y1="42.5" x2="42" y2="42.5" stroke="#2a1d13" stroke-width="1.2"/>
  <!-- eyes -->
  <circle cx="33.5" cy="42.5" r="1.3" fill="#2b1d12"/>
  <circle cx="46.5" cy="42.5" r="1.3" fill="#2b1d12"/>
  <!-- mouth (serious slight smile) -->
  <path d="M36 52 Q40 53 44 52" stroke="#5a3a1f" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- subtle ledger/document icon at corner -->
  <g transform="translate(58 56)" opacity="0.85">
    <rect x="0" y="0" width="10" height="13" rx="1.5" fill="#fffdf6" stroke="#2f4d3a" stroke-width="0.9"/>
    <line x1="2" y1="3.5" x2="8" y2="3.5" stroke="#2f4d3a" stroke-width="0.7"/>
    <line x1="2" y1="6.5" x2="8" y2="6.5" stroke="#2f4d3a" stroke-width="0.7"/>
    <line x1="2" y1="9.5" x2="6" y2="9.5" stroke="#2f4d3a" stroke-width="0.7"/>
  </g>
</svg>
