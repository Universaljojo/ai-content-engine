<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bg-qa" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d8e8d8"/>
      <stop offset="60%" stop-color="#7fae8f"/>
      <stop offset="100%" stop-color="#3f6b54"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg-qa)"/>
  <!-- shoulders / lab coat -->
  <path d="M14 78 Q14 56 40 56 Q66 56 66 78 Z" fill="#ffffff" opacity="0.95"/>
  <!-- coat collar/V -->
  <path d="M30 58 L40 64 L50 58 L50 64 L40 70 L30 64 Z" fill="#1f2e2a" opacity="0.55"/>
  <!-- inner shirt color -->
  <path d="M36 58 L40 62 L44 58 L44 70 L36 70 Z" fill="#3f6b54" opacity="0.7"/>
  <!-- hair (short neat) -->
  <path d="M24 36 Q24 18 40 16 Q56 18 56 36 Q54 30 50 28 Q44 28 40 30 Q34 28 30 28 Q26 30 24 36 Z" fill="#2a1d13"/>
  <!-- face -->
  <ellipse cx="40" cy="42" rx="14.5" ry="16" fill="#f4c79a"/>
  <!-- safety / inspector goggles (round oversized) -->
  <circle cx="33" cy="42" r="6" fill="#fff" opacity="0.15" stroke="#1e1612" stroke-width="1.6"/>
  <circle cx="47" cy="42" r="6" fill="#fff" opacity="0.15" stroke="#1e1612" stroke-width="1.6"/>
  <line x1="39" y1="42" x2="41" y2="42" stroke="#1e1612" stroke-width="1.4"/>
  <!-- eyes focused -->
  <circle cx="33" cy="42.5" r="1.4" fill="#2b1d12"/>
  <circle cx="47" cy="42.5" r="1.4" fill="#2b1d12"/>
  <!-- light reflection on goggles (gives "looking through lens" feel) -->
  <ellipse cx="30.5" cy="40" rx="1.4" ry="0.9" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="44.5" cy="40" rx="1.4" ry="0.9" fill="#ffffff" opacity="0.6"/>
  <!-- mouth (slight focused frown) -->
  <line x1="36" y1="52" x2="44" y2="52" stroke="#5a3a1f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- clipboard/checklist at corner -->
  <g transform="translate(54 56)" opacity="0.95">
    <rect x="0" y="0" width="14" height="17" rx="1.5" fill="#fffdf6" stroke="#1f2e2a" stroke-width="0.9"/>
    <rect x="3" y="-2" width="8" height="3" rx="0.6" fill="#3f6b54"/>
    <line x1="2.5" y1="5" x2="11" y2="5" stroke="#3f6b54" stroke-width="0.7"/>
    <line x1="2.5" y1="8" x2="11" y2="8" stroke="#3f6b54" stroke-width="0.7"/>
    <line x1="2.5" y1="11" x2="11" y2="11" stroke="#3f6b54" stroke-width="0.7"/>
    <!-- check marks -->
    <polyline points="2.5,5 3.5,5.8 5,4.2" stroke="#2f6b3f" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="2.5,8 3.5,8.8 5,7.2" stroke="#2f6b3f" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
