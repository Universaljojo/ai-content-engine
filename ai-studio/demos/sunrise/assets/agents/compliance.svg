<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="bg-cm" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fbe4b8"/>
      <stop offset="60%" stop-color="#e8b760"/>
      <stop offset="100%" stop-color="#a67224"/>
    </radialGradient>
  </defs>
  <circle cx="40" cy="40" r="40" fill="url(#bg-cm)"/>
  <!-- shoulders / formal robe -->
  <path d="M14 78 Q14 56 40 56 Q66 56 66 78 Z" fill="#2c2520" opacity="0.95"/>
  <!-- white collar/jabot -->
  <path d="M33 56 L40 62 L47 56 L46 70 L40 64 L34 70 Z" fill="#ffffff" opacity="0.92"/>
  <!-- hair (combed back, slight grey at temples) -->
  <path d="M24 38 Q24 18 40 16 Q56 18 56 38 Q54 30 50 28 Q46 28 42 30 Q38 28 34 28 Q30 30 24 38 Z" fill="#1e1612"/>
  <ellipse cx="26" cy="34" rx="2" ry="4" fill="#7a7066" opacity="0.55"/>
  <ellipse cx="54" cy="34" rx="2" ry="4" fill="#7a7066" opacity="0.55"/>
  <!-- face -->
  <ellipse cx="40" cy="42" rx="14.5" ry="16" fill="#e8b88a"/>
  <!-- glasses (rectangular, authoritative) -->
  <rect x="28" y="40" width="10" height="6.5" rx="1" fill="#fff" opacity="0.15" stroke="#1e1612" stroke-width="1.4"/>
  <rect x="42" y="40" width="10" height="6.5" rx="1" fill="#fff" opacity="0.15" stroke="#1e1612" stroke-width="1.4"/>
  <line x1="38" y1="43" x2="42" y2="43" stroke="#1e1612" stroke-width="1.2"/>
  <!-- eyes -->
  <circle cx="33" cy="43" r="1.3" fill="#2b1d12"/>
  <circle cx="47" cy="43" r="1.3" fill="#2b1d12"/>
  <!-- moustache hint -->
  <path d="M34 50 Q40 51 46 50" stroke="#1e1612" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <!-- mouth (firm) -->
  <line x1="37" y1="54" x2="43" y2="54" stroke="#5a3a1f" stroke-width="1.4" stroke-linecap="round"/>
  <!-- gavel hint at corner -->
  <g transform="translate(54 56) rotate(-20)" opacity="0.9">
    <rect x="0" y="3" width="14" height="4.5" rx="0.8" fill="#7a4a26" stroke="#2c2520" stroke-width="0.6"/>
    <rect x="3" y="0" width="2" height="11" fill="#5a3a1f"/>
  </g>
</svg>
