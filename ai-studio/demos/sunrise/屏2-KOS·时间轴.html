<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunrise · KOS 短视频工作区 · 时间轴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,500;0,600&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"></div>
    <span>Sunrise<span class="dot">.</span><em>ai</em></span>
  </div>
  <div class="crumbs">
    <a href="屏1-首页.html">首页</a>
    <span class="sep">/</span>
    <span class="here">KOS 短视频</span>
  </div>
  <div class="top-spacer"></div>
  <div class="search-pill">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
    搜索模板 · 节点 · 内容
    <span class="k">⌘ K</span>
  </div>
  <button class="icon-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/></svg><span class="pip"></span></button>
  <div class="user-chip">
    <div class="user-ava"><img src="assets/agents/xiaocao.svg" alt="小草"></div>
    <div class="meta"><b>小草</b><span>内容运营</span></div>
  </div>
</header>

<div class="shell">

  <aside class="rail">
    <a class="ri" href="屏1-首页.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
    <div class="ri active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
    <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>
    <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></div>
    <div class="div"></div>
    <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg></div>
    <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="20" x2="21" y2="20"/><line x1="6" y1="20" x2="6" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg></div>
    <div style="flex:1"></div>
    <div class="ri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg></div>
  </aside>

  <main class="work">

    <div class="pbar">
      <div class="field"><span class="lbl">内容包</span><b>「客户经理日常」短视频包 · 2026 Q2</b></div>
      <div class="sep"></div>
      <div class="field"><span class="lbl">目标</span><em>上架好保 · 代理人一键做同款</em></div>
      <div class="sep"></div>
      <div class="field"><span class="lbl">模板</span><b id="tpl-count">12 条</b><span class="pchip gold" data-filter="custom">含 3 条定制</span></div>
      <div class="sep"></div>
      <div class="field"><span class="lbl">进度</span><b id="progress-count">1 / 12 已上架</b></div>
      <div class="right">
        <div class="form-switch">
          <a href="屏2-KOS·横向流水线.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>横向流水线</a>
          <a href="屏2-KOS·时间轴.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="3" x2="12" y2="21"/><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>时间轴</a>
          <a href="屏2-KOS·卡片矩阵.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>卡片矩阵</a>
        </div>
        <button class="btn">▾ 切换内容包</button>
      </div>
    </div>

    <div class="kos-grid">

      <!-- chat (left) -->
      <section class="chat">
        <div class="roster">
          <div class="rh">协作中 · 7 位<span class="meta">小草 在场</span></div>
          <div class="row" id="roster-row"></div>
        </div>
        <div class="stream" id="stream"></div>
        <div class="compose">
          <div class="quick">
            <span class="qchip accent">＋ 发起新批次</span>
            <span class="qchip" onclick="SUNRISE.requestRereview(currentTplId); refreshAll();">↻ 请求样片再审</span>
            <span class="qchip" onclick="SUNRISE.publishTpl(currentTplId); refreshAll();">↗ 上架好保</span>
          </div>
          <div class="input-wrap">
            <textarea placeholder="给团队说点什么...用 @ 提到某位同事" rows="1"></textarea>
            <button class="send" id="btn-send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
          </div>
        </div>
      </section>

      <!-- canvas (right) -->
      <section class="canvas">
        <div class="tpl-strip" id="tpl-strip"></div>

        <div class="canvas-h">
          <div class="ttl">
            <b id="canvas-ttl">模板</b>
            <div class="sub"><b id="canvas-id">TPL-001</b><span id="canvas-meta">普通模板</span></div>
          </div>
          <div class="actions">
            <button class="btn" onclick="SUNRISE.toast('已打开预览页')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>查看预览</button>
            <button class="btn" onclick="SUNRISE.requestRereview(currentTplId); refreshAll();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>请求重审</button>
            <button class="btn gold" id="btn-publish"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>上架好保</button>
          </div>
        </div>

        <div class="canvas-main">
          <div class="timeline-wrap">
            <div class="timeline" id="timeline"></div>
            <div class="tdetail" id="tdetail"></div>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<script src="shared.js"></script>
<script>
let currentTplId = 'TPL-005';   // 默认选定制模板,展示完整 10 节点
let currentFilter = 'all';
let focusNodeId = 4;            // 默认聚焦"合规审核"

function activeTpl() { return SUNRISE.TEMPLATES.find(t => t.id === currentTplId); }

function renderTimeline() {
  const tpl = activeTpl();
  const host = document.getElementById('timeline');
  let html = '';
  SUNRISE.NODE_DEFS.forEach(n => {
    const isSkipped = tpl.type === 'normal' && SUNRISE.NORMAL_SKIP.includes(n.id);
    const state = isSkipped ? 'skipped' : SUNRISE.stateOf(tpl, n.id);
    const a = SUNRISE.AGENTS[n.owner];
    const cls = ['tnode', state, isSkipped ? 'skipped' : '', focusNodeId === n.id && !isSkipped ? 'focus' : ''].filter(Boolean).join(' ');
    const time = (() => {
      const ts = { done: '已完成', now: '进行中', warn: '待你确认', risk: '有风险', queue: '排队中', published: '已上架', skipped: '跳过' };
      return ts[state] || state;
    })();
    html += `<div class="${cls}" data-id="${n.id}" ${isSkipped ? '' : `onclick="focusNode(${n.id})"`}>
      <div class="axis">
        <div class="dot"></div>
        <div class="line"></div>
      </div>
      <div class="card">
        <div class="h">
          <span class="num">${String(n.id).padStart(2,'0')}</span>
          <span class="nm">${n.name}</span>
          <span class="when">${time}</span>
        </div>
        ${isSkipped ? '<div class="summary" style="color: var(--ink-4);">本节点仅在<b>定制模板</b>触发,普通模板自动跳过。</div>' :
        `<div class="who">
          <span class="ava"><img src="${a.ava}" alt="${a.name}"></span>
          ${a.name} · ${a.role}
        </div>
        <div class="summary">${n.out}</div>`}
      </div>
    </div>`;
  });
  host.innerHTML = html;
}

function renderDetail() {
  const tpl = activeTpl();
  const isSkipped = tpl.type === 'normal' && SUNRISE.NORMAL_SKIP.includes(focusNodeId);
  if (isSkipped) {
    focusNodeId = 1;
  }
  const node = SUNRISE.NODE_DEFS.find(n => n.id === focusNodeId);
  const detail = SUNRISE.NODE_DETAILS[focusNodeId] || {};
  const a = SUNRISE.AGENTS[node.owner];
  const state = SUNRISE.stateOf(tpl, focusNodeId);

  let previewHTML = '';
  if (detail.preview) {
    if (detail.preview.kind === 'casting') {
      previewHTML = `<div class="blk">
        <h5>候选主角</h5>
        <div class="preview-grid" style="grid-template-columns: repeat(2, 1fr);">
          ${detail.preview.items.map(p => `
            <div class="pframe" style="aspect-ratio: 3/4;">
              <b>${p.tag}</b>
              <span style="margin-left: 6px; color: var(--ink-3); font-size:10px;">${p.who}</span>
            </div>`).join('')}
        </div>
      </div>`;
    } else if (detail.preview.kind === 'storyboard') {
      previewHTML = `<div class="blk">
        <h5>分镜 6 格</h5>
        <div class="preview-grid">
          ${detail.preview.items.map(p => `<div class="pframe"><b>${p}</b></div>`).join('')}
        </div>
      </div>`;
    } else if (detail.preview.kind === 'video') {
      previewHTML = `<div class="blk">
        <h5>样片预览</h5>
        <div class="video-frame"><div class="play"></div><div class="dur">${detail.preview.dur}</div></div>
      </div>`;
    }
  }

  const rulesHTML = (detail.rules || []).length === 0 ? '' : `
    <div class="blk">
      <h5>命中规则 / 法源</h5>
      ${detail.rules.map(r => `
        <div style="display:grid;grid-template-columns:90px 1fr auto;gap:10px;padding:7px 0;border-bottom:1px dashed var(--ink-line);font-size:12px;">
          <span class="ev law" style="font-family:var(--mono);font-size:10px;color:var(--blue);background:rgba(46,93,166,0.08);padding:2px 6px;border-radius:4px;height:max-content;">${r.law}</span>
          <span>${r.desc}</span>
          <span class="sbadge ${r.sev === 'ok' ? 'done' : (r.sev === 'warn' ? 'warn' : 'risk')}">${r.sev === 'ok' ? '通过' : (r.sev === 'warn' ? '待修订' : '风险')}</span>
        </div>`).join('')}
    </div>`;

  const diffHTML = detail.diff ? `
    <div class="blk">
      <h5>改写 diff</h5>
      <div class="diff">
        <div><span class="del">${detail.diff.del}</span></div>
        <div style="margin-top:4px;">→ <span class="add">${detail.diff.add}</span></div>
      </div>
    </div>` : '';

  const actionsHTML = (detail.actions || []).map((act, i) =>
    `<button class="btn ${i === 0 ? 'primary' : ''}" onclick="handleAction('${act}')">${act}</button>`
  ).join('');

  document.getElementById('tdetail').innerHTML = `
    <div class="h-row">
      <span class="num">${String(focusNodeId).padStart(2,'0')}</span>
      <h2>${node.name}</h2>
      <span class="sbadge ${state}">${SUNRISE.stateLabel(state)}</span>
    </div>
    <div class="who-row">
      <span class="ava"><img src="${a.ava}" alt="${a.name}"></span>
      <b>${a.name}</b> · ${a.role}
    </div>
    <div class="blk">
      <h5>${a.name} 的判断</h5>
      <p>${detail.aiQuote || '暂无说明'}</p>
    </div>
    ${rulesHTML}
    ${diffHTML}
    ${previewHTML}
    <div class="actions" style="margin-top:14px;">${actionsHTML}</div>`;
}

function handleAction(act) {
  if (act.includes('上架')) {
    SUNRISE.publishTpl(currentTplId);
    refreshAll();
  } else if (act.includes('再审') || act.includes('重审') || act.includes('修封面')) {
    SUNRISE.requestRereview(currentTplId);
    refreshAll();
  } else {
    SUNRISE.toast(`已执行: ${act}`);
  }
}
window.handleAction = handleAction;

function focusNode(id) {
  focusNodeId = id;
  renderTimeline();
  renderDetail();
  // 对话区追加同步消息
  const node = SUNRISE.NODE_DEFS.find(n => n.id === id);
  SUNRISE.appendMsg(document.getElementById('stream'), {
    kind: 'msg', who: node.owner,
    text: `小草切到了【${node.name}】节点。我已把最新审核结果同步上来。`,
    when: '刚刚',
    evidence: [{ type:'ev', text:`${activeTpl().id} · ${node.name}` }]
  });
}
window.focusNode = focusNode;

function selectTpl(id) {
  currentTplId = id;
  const tpl = activeTpl();
  document.getElementById('canvas-ttl').textContent = tpl.title;
  document.getElementById('canvas-id').textContent = tpl.id;
  document.getElementById('canvas-meta').textContent = (tpl.type === 'custom' ? '定制模板 · ' : '普通模板 · ') + tpl.product;
  // 自动聚焦"正在进行"的节点
  const ongoing = SUNRISE.NODE_DEFS.find(n => {
    const isSkipped = tpl.type === 'normal' && SUNRISE.NORMAL_SKIP.includes(n.id);
    if (isSkipped) return false;
    const s = SUNRISE.stateOf(tpl, n.id);
    return s === 'now' || s === 'warn' || s === 'risk';
  });
  focusNodeId = ongoing ? ongoing.id : 1;
  refreshAll();
}

function refreshAll() {
  SUNRISE.renderTemplateStrip(document.getElementById('tpl-strip'), currentFilter, currentTplId, selectTpl);
  renderTimeline();
  renderDetail();
  const published = SUNRISE.TEMPLATES.filter(t => Object.values(t.nodeStates).includes('published')).length;
  document.getElementById('progress-count').textContent = `${published} / 12 已上架`;
}

document.addEventListener('DOMContentLoaded', () => {
  SUNRISE.renderRoster(document.getElementById('roster-row'));
  SUNRISE.renderStream(document.getElementById('stream'), SUNRISE.INITIAL_STREAM);
  selectTpl('TPL-005');

  document.querySelectorAll('[data-filter]').forEach(el => {
    el.addEventListener('click', () => {
      currentFilter = currentFilter === el.dataset.filter ? 'all' : el.dataset.filter;
      document.querySelectorAll('[data-filter]').forEach(e2 => e2.classList.toggle('active', currentFilter === e2.dataset.filter));
      refreshAll();
    });
  });

  document.getElementById('btn-publish').addEventListener('click', () => {
    SUNRISE.publishTpl(currentTplId);
    refreshAll();
  });

  const ta = document.querySelector('.compose textarea');
  document.getElementById('btn-send').addEventListener('click', () => {
    const text = ta.value.trim();
    if (!text) return;
    SUNRISE.appendMsg(document.getElementById('stream'), { kind:'msg', who:'xiaocao', text, when:'刚刚' });
    ta.value = '';
    setTimeout(() => {
      SUNRISE.appendMsg(document.getElementById('stream'), {
        kind:'msg', who:'director',
        text:'收到,我同步给文案和合规一起跟进。',
        when:'刚刚',
        evidence:[{ type:'ev', text:'已 @文案 @合规审核' }]
      });
    }, 700);
  });
});
</script>

</body>
</html>
