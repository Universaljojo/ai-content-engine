const TOP10 = [
  { cover: 'linear-gradient(145deg,#be185d,#f472b6)', title: '拍手! 朴素 vs 爆炸', ref: true },
  { cover: 'linear-gradient(145deg,#6b21a8,#a855f7)', title: '姐妹组合也来了', ref: false },
  { cover: 'linear-gradient(145deg,#831843,#ec4899)', title: '上班 → 度假 一拍就到', ref: true },

  { cover: 'linear-gradient(145deg,#9f1239,#fb7185)', title: '同事群办公室版', ref: false },

  { cover: 'linear-gradient(145deg,#4a044e,#a21caf)', title: '姐妹四人 同步挑战', ref: false },

];

const PATTERNS = {
  stable: ['拍手动作本身','镜头在拍手瞬间切换','变身前后强烈视觉反差','BGM 在拍手节点卡重音'],
  variable: ['变装主题(朴素 → 华丽)','人数(单 / 双 / 多人同步)','场景(室内 / 室外)','BGM(Unstoppable / 抖音神曲)'],
  saturated: ['通勤变晚宴(3 条)','闺蜜互换造型(2 条)'],
  blank: ['宠物参与拍手换装','父子 / 母女同框变装','工作装 → 运动装(健身场景)']
};

function renderGrid() {
  document.getElementById('hot-grid').innerHTML = HOTSPOTS.map(h => `
    <div class="hot-card" data-id="${h.id}">
      <button class="star ${h.saved ? 'active' : ''}" data-star="${h.id}" title="收藏">${h.saved ? '★' : '☆'}</button>
      <div class="ttl-row"><div class="ttl">${h.title}</div></div>
      <div class="explain">${h.explain}</div>
      <div class="videos">
        <div class="vstrip">
          ${h.covers.map((c, i) => `
            <div class="hot-vmini">
              <div class="cover" style="background:${c}"></div>
              <span class="play"></span>
              <div class="vt">${h.titles[i]}</div>
            </div>`).join('')}
        </div>
      </div>
      <div class="data">
        <div class="row ${h.muted ? 'muted' : ''}"><span class="label">浏览</span><span class="v">累计 <b>${h.cumView}</b></span><span class="delta">▲ 7 天 ${h.delta7View}</span></div>
        <div class="row ${h.muted ? 'muted' : ''}"><span class="label">参与</span><span class="v">累计 <b>${h.cumJoin}</b></span><span class="delta">▲ 7 天 ${h.delta7Join}</span></div>
        <div class="age-row">冒头 ${h.age} · ${h.insurance}</div>
      </div>
    </div>`).join('');

  // 绑事件
  document.querySelectorAll('.hot-card').forEach(c => {
    c.addEventListener('click', e => {
      if (e.target.closest('.star') || e.target.closest('.play') || e.target.closest('.hot-vmini')) return;
      openDrawer(c.dataset.id);
    });
  });
  document.querySelectorAll('[data-star]').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const id = b.dataset.star;
      const h = HOTSPOTS.find(x => x.id === id);
      h.saved = !h.saved;
      b.classList.toggle('active');
      b.textContent = h.saved ? '★' : '☆';
      // 同步抽屉里的星星
      if (drawerOpenId === id) {
        const ds = document.getElementById('dStar');
        ds.classList.toggle('active', h.saved);
      }
    });
  });
}

let drawerOpenId = null;

function openDrawer(id) {
  const h = HOTSPOTS.find(x => x.id === id);
  if (!h) return;
  drawerOpenId = id;

  document.querySelectorAll('.hot-card').forEach(c => c.classList.toggle('selected', c.dataset.id === id));
  document.getElementById('dTitle').textContent = h.title;
  document.getElementById('dStar').classList.toggle('active', h.saved);
  renderDrawerBody(h);
  document.getElementById('drawer').classList.add('open');
  document.getElementById('scrim').classList.add('show');
  document.getElementById('shell').classList.add('drawer-open');
}

function closeDrawer() {
  drawerOpenId = null;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
  document.getElementById('shell').classList.remove('drawer-open');
  document.querySelectorAll('.hot-card').forEach(c => c.classList.remove('selected'));
}

function renderDrawerBody(h) {
  document.getElementById('dBody').innerHTML = `
    <div class="d-explain">${h.explain}</div>

    <div class="d-sec">
      <div class="d-sec-h">
        <div class="lbl">AI 拆出来的</div>
        <h3>二创规律</h3>
        <div class="sub">基于本期采集 Top 10 自动拆解 · 骨架必须保留 / 变的是你的空间 / 饱和的避开 / 空白的是机会</div>
      </div>
      <div class="pattern-quad">
        <div class="pcard stable">
          <div class="ph"><span class="pic">🦴</span><span class="pn">不变的</span><span class="pmeta">10/10</span></div>
          <ul>${PATTERNS.stable.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="pcard variable">
          <div class="ph"><span class="pic">🎨</span><span class="pn">变的</span><span class="pmeta">各不相同</span></div>
          <ul>${PATTERNS.variable.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="pcard saturated">
          <div class="ph"><span class="pic">⚠</span><span class="pn">已做烂</span><span class="pmeta">Top 10 撞车</span></div>
          <ul>${PATTERNS.saturated.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
        <div class="pcard blank">
          <div class="ph"><span class="pic">✨</span><span class="pn">暂未有人做</span><span class="pmeta">建议切入</span></div>
          <ul>${PATTERNS.blank.map(x => `<li>${x}</li>`).join('')}</ul>
        </div>
      </div>
    </div>

    <div class="d-sec">
      <div class="d-sec-h">
        <div class="lbl">Top 10 爆款</div>
        <h3>看完这 10 条,你会更懂这梗</h3>
        <div class="sub">点封面播放 · 右上角勾选"作为参考",生成视频时这些路径会作为 context 喂给制作组</div>
      </div>
      <div class="top10-grid" id="top10Grid">
        ${TOP10.map((v, i) => `
          <div class="top10-cell ${v.ref ? 'ref' : ''}" data-idx="${i}">
            <div class="cover" style="background:${v.cover}"></div>
            <span class="rank">${i + 1}</span>
            <button class="ref-btn">${v.ref ? '✓' : '+'}</button>
            <span class="play"></span>
            <div class="vt">${v.title}</div>
          </div>`).join('')}
      </div>
    </div>

    <div class="d-databar">
      <div class="row"><span class="label">浏览</span><span class="v">累计 <b>${h.cumView}</b></span><span class="delta">▲ 7 天 ${h.delta7View}</span></div>
      <div class="row"><span class="label">参与</span><span class="v">累计 <b>${h.cumJoin}</b></span><span class="delta">▲ 7 天 ${h.delta7Join}</span></div>
      <div class="row age">冒头 ${h.age} · 话题 ID ${h.id}</div>
    </div>`;

  // ref 勾选
  document.querySelectorAll('.top10-cell .ref-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const cell = btn.closest('.top10-cell');
      cell.classList.toggle('ref');
      btn.textContent = cell.classList.contains('ref') ? '✓' : '+';
      updateRefCount();
    });
  });
  updateRefCount();
}

function updateRefCount() {
  const n = document.querySelectorAll('.top10-cell.ref').length;
  document.getElementById('refCount').textContent = `${n} 条`;
  document.getElementById('btnGo').disabled = n === 0;
}

document.getElementById('btnClear').addEventListener('click', () => {
  document.querySelectorAll('.top10-cell').forEach(c => {
    c.classList.remove('ref');
    c.querySelector('.ref-btn').textContent = '+';
  });
  updateRefCount();
});

document.getElementById('btnGo').addEventListener('click', () => {
  const n = document.querySelectorAll('.top10-cell.ref').length;
  if (n === 0) return;
  const t = document.getElementById('dTitle').textContent;
  toast(`已携带 ${n} 条参考视频 + 热点【${t}】跳到 KOS 工作台`);
  setTimeout(() => {
    window.location.href = '屏2-KOS·对话工作台.html';
  }, 900);
});

document.getElementById('dClose').addEventListener('click', closeDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// 抽屉头部星星
document.getElementById('dStar').addEventListener('click', () => {
  if (!drawerOpenId) return;
  const h = HOTSPOTS.find(x => x.id === drawerOpenId);
  h.saved = !h.saved;
  document.getElementById('dStar').classList.toggle('active', h.saved);
  // 同步列表
  const card = document.querySelector(`.hot-card[data-id="${drawerOpenId}"]`);
  if (card) {
    const star = card.querySelector('.star');
    star.classList.toggle('active', h.saved);
    star.textContent = h.saved ? '★' : '☆';
  }
});

// 排序 chip
document.querySelectorAll('.sort-chip').forEach(c => {
  c.addEventListener('click', () => {
    document.querySelectorAll('.sort-chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    toast(`已切换排序: ${c.textContent}`);
  });
});

// 简易 toast (复用 SUNRISE 提供的或者自己写)
function toast(text) {
  let host = document.querySelector('.toast-host');
  if (!host) {
    host = document.createElement('div');
    host.className = 'toast-host';
    document.body.appendChild(host);
  }
  const el = document.createElement('div');
  el.className = 'toast success';
  el.innerHTML = `<span class="ic">✓</span>${text}`;
  host.appendChild(el);
  setTimeout(() => { el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2400);
}

renderGrid();
</script>

</body>
